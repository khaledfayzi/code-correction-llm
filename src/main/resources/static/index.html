<!DOCTYPE html>
<html>
<head>
    <title>Code Correction</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 600px;
            margin: auto;
        }
        textarea {
            width: 100%;
            height: 200px;
        }
        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        pre {
            background: #eee;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Code Correction System</h1>

    <textarea id="code" placeholder="Java Code hier..."></textarea>
    <br><br>

    <button onclick="submitCode()">Submit</button>

    <h2>Result</h2>
    <pre id="result"></pre>
</div>

<script>
function submitCode() {
    const code = document.getElementById("code").value;

    fetch("/api/submit", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ studentCode: code })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").textContent =
            "Score: " + data.score + "\n\n" + data.feedback;
    });
}
</script>

</body>
</html>
